name: Deploy Dashboard QA-OMA a GitHub Pages

# Publica el contenido de este repo (la app estática, sin backend ni
# credenciales) a GitHub Pages en cada push a main. Los datos viven en
# IndexedDB del navegador de cada quien (ver js/dataService.js) — no hay
# nada que generar ni ningún secret que configurar.
#
# En GitHub: Settings > Pages, selecciona "Source: GitHub Actions".

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Pages
        uses: actions/configure-pages@v5

      - name: Subir artefacto
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Desplegar a GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
